name: felslager

x-worker: &worker
  init: true
  restart: unless-stopped
  environment: &worker-env
    FELSLAGER_JOBS_URL: ${FELSLAGER_JOBS_URL:-http://host.docker.internal:3001/api/processing}
    BOLT_WORKER_TOKEN: ${BOLT_WORKER_TOKEN:?Set BOLT_WORKER_TOKEN in .env}
    PREFECT_API_URL: http://prefect-server:4200/api
    PREFECT_SERVER_ALLOW_EPHEMERAL_MODE: "false"
    PREFECT_LOGGING_EXTRA_LOGGERS: felslager-worker
  depends_on:
    prefect-server:
      condition: service_healthy
  extra_hosts:
    - "host.docker.internal:host-gateway"
  volumes:
    - &processing-mount
      type: bind
      source: ${PROCESSING_DIR:?Set an absolute PROCESSING_DIR shared with the host API}
      target: ${PROCESSING_DIR:?Set an absolute PROCESSING_DIR shared with the host API}
      bind:
        create_host_path: false
    - &capture-mount
      type: bind
      source: ${CAPTURE_DIR:?Set an absolute CAPTURE_DIR shared with the host API}
      target: ${CAPTURE_DIR:?Set an absolute CAPTURE_DIR shared with the host API}
      read_only: true
      bind:
        create_host_path: false

services:
  prefect-server:
    image: prefecthq/prefect:3.8.8-python3.10
    restart: unless-stopped
    command: ["prefect", "server", "start", "--host", "0.0.0.0"]
    environment:
      PREFECT_HOME: /var/lib/prefect
      PREFECT_SERVER_ANALYTICS_ENABLED: "false"
      PREFECT_UI_API_URL: http://127.0.0.1:${PREFECT_PORT:-4200}/api
    ports:
      - "127.0.0.1:${PREFECT_PORT:-4200}:4200"
    volumes:
      - prefect-data:/var/lib/prefect
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4200/api/health', timeout=5)"]
      interval: 5s
      timeout: 10s
      retries: 30
      start_period: 20s

  worker-detection:
    <<: *worker
    profiles: [detection]
    build:
      context: ./processing
      target: detection
    command: ["--role", "detection"]

  worker-odm:
    <<: *worker
    profiles: [odm]
    build:
      context: ./processing
      target: reconstruction
    environment:
      <<: *worker-env
      NODEODM_URL: http://nodeodm:3000
    command: ["--role", "reconstruction", "--engine", "odm"]
    depends_on:
      prefect-server:
        condition: service_healthy
      nodeodm:
        condition: service_started

  nodeodm:
    profiles: [odm]
    image: opendronemap/nodeodm:3.5.6
    restart: unless-stopped
    volumes:
      - nodeodm-data:/var/www/data

  worker-meshroom:
    <<: *worker
    profiles: [meshroom]
    build:
      context: ./processing
      target: meshroom
    gpus: all
    volumes:
      - *processing-mount
      - *capture-mount
      - type: bind
        source: ${MESHROOM_INSTALL_DIR:-/opt/Meshroom-2025.1.0}
        target: /opt/meshroom
        read_only: true
        bind:
          create_host_path: false
    command: ["--role", "reconstruction", "--engine", "meshroom"]

  worker-realityscan:
    <<: *worker
    profiles: [realityscan]
    build:
      context: ./processing
      target: realityscan
      additional_contexts:
        realityscan-installer: ${REALITYSCAN_INSTALLER_DIR:-/opt/felslager-installers/realityscan}
    gpus: all
    devices:
      - /dev/dri:/dev/dri
    group_add:
      - ${VIDEO_GID:-44}
      - ${RENDER_GID:-109}
    volumes:
      - *processing-mount
      - *capture-mount
      - realityscan-state:/var/lib/realityscan
    command: ["--role", "reconstruction", "--engine", "realityscan"]

volumes:
  prefect-data:
  nodeodm-data:
  realityscan-state:
