name: Deploy Felslager Backend

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: self-hosted
    steps:
      - name: Deploy to production
        run: |
          cd /home/vorstieg/felslager
          git pull origin main
          npm install
          PM2_HOME=/home/vorstieg/.pm2 pm2 restart felslager
