name: Deploy Felslager Backend

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: npm test
  deploy:
    if: github.event_name == 'push'
    needs: test
    runs-on: self-hosted
    steps:
      - name: Deploy to production
        run: |
          cd /home/vorstieg/felslager
          git pull origin main
          npm ci
          PM2_HOME=/home/vorstieg/.pm2 pm2 restart felslager
